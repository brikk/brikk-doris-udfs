name: release

# Tag -> GitHub release with the deployable Doris UDF jar attached.
# The asset URL is stable per tag and anonymously downloadable — exactly what
# CREATE FUNCTION's "file" property points at:
#   https://github.com/<org>/brikk-doris-udfs/releases/download/<tag>/brikk-doris-udfs-lucene-all.jar
# Version by TAG on every change: Doris BEs cache the jar per function signature,
# so a new jar must live at a NEW tag URL (then DROP/CREATE FUNCTION to reload).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Amper
            ~/.cache/JetBrains
            ~/.kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('**/module.yaml', 'project.yaml', 'kotlin') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Test
        run: ./kotlin test

      - name: Build deployable flat jar
        run: ./tools/build-udf-jar.sh

      - name: Checksum
        run: cd build && sha256sum brikk-doris-udfs-lucene-all.jar > brikk-doris-udfs-lucene-all.jar.sha256

      - name: Create release + attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/brikk-doris-udfs-lucene-all.jar \
            build/brikk-doris-udfs-lucene-all.jar.sha256
