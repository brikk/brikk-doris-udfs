name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ./kotlin wrapper provisions its own JRE + Kotlin toolchain; cache both
      # the bootstrap and the dependency caches between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Amper
            ~/.cache/JetBrains
            ~/.kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('**/module.yaml', 'project.yaml', 'kotlin') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Test
        run: ./kotlin test

      - name: Build deployable flat jar (packaging smoke)
        run: ./tools/build-udf-jar.sh

      - uses: actions/upload-artifact@v4
        with:
          name: udf-lucene-all
          path: build/udf-lucene-all.jar
          retention-days: 14
